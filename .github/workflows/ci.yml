name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baseline (Python, project validation and compilation of the sources)
        uses: ./.github/actions/urtc-baseline
      - name: Static checks (unused names, exception chaining, syntax)
        run: |
          python -m pip install "ruff==0.17.1"
          ruff check .
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts
      - name: Download the firmware images of the release (verified against the release signature)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync-firmware
      - name: Type check
        run: npm run lint
      - name: Tests
        run: npm run test:coverage
      - name: Build the static site
        run: npm run build
      - name: Install the browser for the end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: End-to-end checks of the built page (offline copy, thermal history, saved session)
        run: npm run test:e2e
      - name: Keep the report of a failed end-to-end run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: test-results/
          if-no-files-found: ignore
